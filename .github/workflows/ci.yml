name: Money Tracker CI

on:
  push:
    branches: [main, lane-d-waves-11-12-15, block-d-exports-reporting, block-c-imports-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Run test suite
        run: npm test
      - name: Run Offline Block B contract gate
        run: npm run test:offline-b
      - name: Run Offline Block C contract gate
        run: npm run test:offline-c
      - name: Run Offline Block D contract gate
        run: npm run test:offline-d
      - name: Run Offline Block E contract gate
        run: npm run test:offline-e
      - name: Run Offline Block F contract gate
        run: npm run test:offline-f
      - name: Run Wave 100A Offline Bank Feed gate
        run: npm run test:wave100a
      - name: Run Wave 100B Offline Schedules gate
        run: npm run test:wave100b
      - name: Run Wave 100C Offline Attachment Cache gate
        run: npm run test:wave100c
      - name: Run Wave 100D Offline Search & Filters gate
        run: npm run test:wave100d
      - name: Run Wave 100E Offline Recovery Restore gate
        run: npm run test:wave100e
      - name: Run Wave 4 desktop/tablet gate
        run: npm run test:wave4
      - name: Run Lane D release gate
        run: npm run test:lane-d
      - name: Run Wave 5 PWA integrity gate
        run: npm run test:wave5
      - name: Run Waves 11-12 release gate
        run: npm run test:wave11-12
      - name: Run Wave 13 production smoke gate
        run: npm run test:wave13
      - name: Run Wave 14 visual contract
        run: node --test tests/release-wave-14-visual-audit.test.js
      - name: Run Wave 15 final release-candidate gate
        run: npm run test:wave15
      - name: Run accounting reconciliation gate
        run: npm run accounting:check
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check server.mjs
          node --check service-worker.js
          node --check lib/reports-ui.js
          node --check lib/reporting.js
          node --check lib/xlsx.js
          node --check lib/pdf.js
          node --check lib/fx.js
          node --check block-c-import.js
          node --check lib/importer.js
          node --check lib/legacy-excel.js
          node --check lib/xlsx-import.js
          node --check block-e-recurring.js
          node --check lib/recurring-rule-form.js
          node --check lib/recurring.js
          node --check lib/recurring-worker.js
          node --check lib/pwa.js
          node --check lib/security-ops.js
          node --check lib/runtime-ops.js
          node --check lib/production-smoke.js
          node --check block-f-bank-feed.js
          node --check lib/bank-feed.js
          node --check lib/bank-server.js
          node --check lib/store.js
          node --check lib/offline-db.js
          node --check block-g-insights.js
          node --check lib/insights.js
          node --check lib/insights-server.js
          node --check lib/db-snapshot.js
          node --check lib/full-backup.js
          node --check lib/data-limits.js
          node --check lib/money.js
          node --check lib/money-storage.js
          node --check lib/money-parse.js
          node --check scripts/create-db-snapshot.mjs
          node --check scripts/restore-db-snapshot.mjs
          node --check scripts/accounting-check.mjs
          node --check scripts/accounting-bank-feed-check.mjs
          node --check scripts/e2e-server.mjs
          node --check scripts/production-smoke.mjs
          node --check playwright.config.mjs
          node --check e2e/release-critical.spec.mjs
          node --check e2e/offline-block-a.spec.mjs
          node --check e2e/offline-block-b.spec.mjs
          node --check e2e/offline-block-c.spec.mjs
          node --check e2e/offline-block-d.spec.mjs
          node --check e2e/offline-block-e.spec.mjs
          node --check e2e/offline-block-f.spec.mjs
          node --check e2e/wave100a-offline-bank-feed.spec.mjs
          node --check e2e/wave100b-offline-recurring.spec.mjs
          node --check e2e/wave100c-offline-attachment-cache.spec.mjs
          node --check e2e/wave100d-offline-search-filters.spec.mjs
          node --check e2e/wave100e-offline-recovery-restore.spec.mjs
          node --check lib/offline-query.js
          node --check lib/offline-recovery.js
          node --check e2e/wave14-fixture.mjs
          node --check e2e/visual-audit-matrix.spec.mjs
          node --check e2e/visual-audit-states.spec.mjs
          node --check e2e/visual-audit-overlays.spec.mjs
          node --check pwa-version.js


  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Wave 10 browser E2E
        run: npm run test:wave10
      - name: Run Offline Block A browser gate
        run: npm run test:offline-a-e2e
      - name: Run Offline Block B browser gate
        run: npm run test:offline-b-e2e
      - name: Run Offline Block C browser gate
        run: npm run test:offline-c-e2e
      - name: Run Offline Block D browser gate
        run: npm run test:offline-d-e2e
      - name: Run Offline Block E browser gate
        run: npm run test:offline-e-e2e
      - name: Run Offline Block F browser gate
        run: npm run test:offline-f-e2e
      - name: Run Wave 100A Offline Bank Feed browser gate
        run: npm run test:wave100a-e2e
      - name: Run Wave 100B Offline Schedules browser gate
        run: npm run test:wave100b-e2e
      - name: Run Wave 100C Offline Attachment Cache browser gate
        run: npm run test:wave100c-e2e
      - name: Run Wave 100D Offline Search & Filters browser gate
        run: npm run test:wave100d-e2e
      - name: Run Wave 100E Offline Recovery Restore browser gate
        run: npm run test:wave100e-e2e
      - name: Run Wave 14 visual audit
        run: npm run test:wave14
      - name: Upload Wave 14 visual audit
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wave14-visual-audit
          path: test-results/wave14-visual
          if-no-files-found: error
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave10-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
