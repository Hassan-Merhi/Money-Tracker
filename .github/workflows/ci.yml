name: Money Tracker CI

on:
  push:
    branches: [main, lane-d-waves-11-12-15, block-d-exports-reporting, block-c-imports-final]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Run test suite
        run: npm test
      - name: Run Wave 4 desktop/tablet gate
        run: npm run test:wave4
      - name: Run Lane D release gate
        run: npm run test:lane-d
      - name: Run Wave 5 PWA integrity gate
        run: npm run test:wave5
      - name: Run Waves 11-12 release gate
        run: npm run test:wave11-12
      - name: Run Wave 13 production smoke gate
        run: npm run test:wave13
      - name: Run Wave 14 visual contract
        run: node --test tests/release-wave-14-visual-audit.test.js
      - name: Run accounting reconciliation gate
        run: npm run accounting:check
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check server.mjs
          node --check service-worker.js
          node --check lib/reports-ui.js
          node --check lib/reporting.js
          node --check lib/xlsx.js
          node --check lib/pdf.js
          node --check block-c-import.js
          node --check lib/importer.js
          node --check lib/legacy-excel.js
          node --check lib/xlsx-import.js
          node --check block-e-recurring.js
          node --check lib/recurring-rule-form.js
          node --check lib/recurring.js
          node --check lib/recurring-worker.js
          node --check lib/pwa.js
          node --check lib/security-ops.js
          node --check lib/runtime-ops.js
          node --check lib/production-smoke.js
          node --check block-f-bank-feed.js
          node --check lib/bank-feed.js
          node --check lib/bank-server.js
          node --check lib/store.js
          node --check block-g-insights.js
          node --check lib/insights.js
          node --check lib/insights-server.js
          node --check lib/db-snapshot.js
          node --check lib/full-backup.js
          node --check lib/data-limits.js
          node --check lib/money.js
          node --check lib/money-storage.js
          node --check lib/money-parse.js
          node --check scripts/create-db-snapshot.mjs
          node --check scripts/restore-db-snapshot.mjs
          node --check scripts/accounting-check.mjs
          node --check scripts/accounting-bank-feed-check.mjs
          node --check scripts/e2e-server.mjs
          node --check scripts/production-smoke.mjs
          node --check playwright.config.mjs
          node --check e2e/release-critical.spec.mjs
          node --check e2e/wave14-fixture.mjs
          node --check e2e/visual-audit-matrix.spec.mjs
          node --check e2e/visual-audit-states.spec.mjs
          node --check e2e/visual-audit-overlays.spec.mjs
          node --check pwa-version.js


  browser-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install browser test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Wave 10 browser E2E
        run: npm run test:wave10
      - name: Run Wave 14 visual audit
        run: npm run test:wave14
      - name: Upload Wave 14 visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave14-visual-audit
          path: test-results/wave14-visual
          if-no-files-found: error
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wave10-playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
